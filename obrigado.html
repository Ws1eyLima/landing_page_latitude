<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Obrigado por se cadastrar na Latitude Streetwear">
    <title>Obrigado - Latitude Streetwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Urbanist:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon.png">
    <link rel="shortcut icon" href="/assets/favicon.png">
    <style>
        .thank-you-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, var(--deep-blue) 0%, #1a2f3a 100%);
            text-align: center;
        }
        
        .thank-you-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        
        .thank-you-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            background-color: var(--indian-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease;
        }
        
        .thank-you-icon svg {
            width: 50px;
            height: 50px;
            color: var(--white);
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        
        .thank-you-title {
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--white);
            margin-bottom: 1.5rem;
            font-weight: 900;
            font-family: var(--font-heading);
            letter-spacing: -0.02em;
        }
        
        .thank-you-message {
            font-size: clamp(1.1rem, 2vw, 1.25rem);
            color: var(--silver);
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        
        .thank-you-cta {
            margin-top: 2.5rem;
        }
        
        .countdown-redirect {
            color: var(--silver);
            font-size: 0.95rem;
            margin-top: 1.5rem;
        }
        
        .countdown-number {
            color: var(--indian-red);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <section class="thank-you-section">
        <div class="container">
            <div class="thank-you-content">
                <div class="thank-you-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h1 class="thank-you-title">Obrigado!</h1>
                <p class="thank-you-message">
                    Você agora faz parte da lista antecipada da Latitude.
                </p>
                <p class="thank-you-message">
                    Você será redirecionado para a comunidade em instantes.
                </p>
                <div class="countdown-redirect">
                    Redirecionando em <span class="countdown-number" id="countdown">3</span> segundos...
                </div>
                <div class="thank-you-cta">
                    <a href="https://chat.whatsapp.com/CPfrQFITV8sGt62xdoSaDj?mode=wwt" class="btn btn-primary btn-large" target="_blank" rel="noopener noreferrer">Entrar na Comunidade</a>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Contador regressivo e redirecionamento automático
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        const whatsappLink = 'https://chat.whatsapp.com/CPfrQFITV8sGt62xdoSaDj?mode=wwt';
        
        const countdownInterval = setInterval(function() {
            countdown--;
            if (countdownElement) {
                countdownElement.textContent = countdown;
            }
            
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                window.location.href = whatsappLink;
            }
        }, 1000);
    </script>
</body>
</html>
